services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - /srv/links/data:/data
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile - --no-control-socket"]
